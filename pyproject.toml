[project]
name = "ai-agent-from-scratch"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "datasets>=5.2.0",
    "dotenv>=0.9.9",
    "litellm>=1.108.3",
    "openai>=3.48.0",
    "pydantic>=2.14.3",
    "pyyaml>=6.0.3",
    "tqdm>=4.70.1",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agents"]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
]
